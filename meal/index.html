 if(r<=0){t.textContent="[ TIMER DONE ]";if(!TM.d){TM.d=1;try{navigator.vibrate([500,200,500,200,500])}catch(x){}try{var o=AC.createOscillator();o.connect(AC.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop()},700)}catch(x){}}}
 else t.textContent="[ "+Math.floor(r/60)+":"+("0"+r%60).slice(-2)+" ]"}

var pd=3;

 for(var i=s0;i<Math.min(14,s0+pd);i++){var c=S.ck[i],p=S.plan[i];[[1,0],[2,1]].forEach(function(a){if(c[a[0]])return;var m=p[a[1]],x=ml(i,a[1]);if(!x)return;cnt[m]=(cnt[m]||0)+x;for(var k in USE[m])tot[k]=(tot[k]||0)+USE[m][k]*x})}
 var ms=Object.keys(cnt).sort(function(a,b){return parseInt(M[b].t.replace(/\D/g,""))-parseInt(M[a].t.replace(/\D/g,""))});
 return '<h1>== PREP SESSION ==</h1><div class="card"><select id="cs">'+copt()+'</select><div class="row" style="margin-top:8px">'+[1,2,3].map(function(b){return '<button class="link" data-pd="'+b+'">'+(b===pd?'[':' ')+b+(b>1?' days':' day')+(b===pd?']':' ')+'</button>'}).join("")+'</div><p class="tip">Covers day '+(s0+1)+' to '+Math.min(14,s0+pd)+', skipping eaten and leftover meals.</p></div><h2>Cook in this order</h2><div class="card"><ol>'+(ms.length?ms.map(function(m){return '<li>'+cnt[m]+' x '+m+' ('+M[m].t+' each)</li>'}).join(""):'<li>Nothing left to cook.</li>')+'</ol><p class="tip">Start the longest simmer first. Boil pasta and rice while it cooks and use the airfryer last. Fridge leftovers keep 2–3 days, or freeze them.</p></div><h2>Total ingredients</h2><div class="card"><ul>'+I.filter(function(r){return tot[r[0]]}).map(function(r){return '<li>'+r[0]+': '+f(tot[r[0]])+r[1]+'</li>'}).join("")+'</ul></div>'}
function wtCard(){var ks=Object.keys(S.wt).sort().slice(-14),v=ks.map(function(k){return S.wt[k]}),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),g=ks.map(function(k){var w=S.wt[k];return k.slice(5)+" "+w.toFixed(1)+" "+Array(Math.round((w-mn)/((mx-mn)||1)*16)+2).join("#")}).join("\n"),ch=v.length?v[v.length-1]-v[0]:0;
 return '<div class="card"><b>> WEIGH-IN (kg)</b><div class="row" style="margin-top:8px"><input type="number" id="wi" step="0.1" inputmode="decimal" placeholder="today" style="width:110px;margin:0"><button class="link" id="wb">[log]</button></div>'+(ks.length?'<pre class="art" style="color:var(--text);font-size:12px">'+g+'</pre><p class="tip">Change: '+(ch>=0?'+':'')+ch.toFixed(1)+' kg since '+ks[0]+'</p>':'')+'</div>'}

 document.getElementById("app").innerHTML='<div id="track"><div class="pg" id="p1">'+plan()+'</div><div class="pg" id="p2">'+cookV()+'</div><div class="pg" id="p3">'+stockV()+'</div></div>';
 for(i=0;i<3;i++)document.getElementById("p"+(i+1)).scrollTop=sc[i];
 pos(tab,0);navs();bind()}

 var q=function(s){return document.querySelectorAll(s)};

var sx=0,sy=0,st=0,mode=0,dx=0;
