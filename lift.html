ground:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--red2);padding:8px}.btn.small{padding:8px 11px;font-size:12px;border-radius:10px}.btn.full{width:100%;margin-top:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 11px}.section-head h3{font-size:15px;margin:0;font-weight:800}.section-head span{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{display:block;font-size:21px;letter-spacing:-.5px}.stat span{font-size:11px;color:var(--muted)}.daylist{display:grid;gap:9px}.day{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.day.active{border-color:#743337;background:#211719}.daymark{width:38px;height:38px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-weight:850;color:var(--red2)}.dayinfo{flex:1;min-width:0}.dayinfo b{display:block;font-size:13px}.dayinfo small{color:var(--muted);font-size:11px}.dayarrow{color:var(--muted);font-size:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px 0}.exercise{padding:14px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0;padding-bottom:0}.ex-top{display:flex;justify-content:space-between;gap:12px}.ex-name{font-weight:800;font-size:14px}.ex-meta{font-size:11px;color:var(--muted);white-space:nowrap}.cue{font-size:12px;color:var(--muted);margin:4px 0 9px}.hint{font-size:11px;color:var(--red2);background:#ff554f10;padding:8px 10px;border-radius:10px;margin:7px 0 9px}.sethead,.setrow{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:7px;align-items:center}.sethead{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:0 0 5px}.setrow{margin:6px 0}.setnum{color:var(--muted);font-size:12px}.field{min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;background:#0e0e12;color:var(--text);padding:9px 8px;font-size:14px}.check{width:24px;height:24px;accent-color:var(--red);justify-self:center}.complete{color:var(--green);font-size:11px;font-weight:800}.progressbar{height:7px;border-radius:99px;background:#292932;overflow:hidden;margin:9px 0}.progressbar i{display:block;height:100%;background:var(--red);border-radius:99px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#101014f2;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.tabsin{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tab{border:0;background:transparent;color:var(--muted);padding:8px 3px;border-radius:12px;font-size:10px;font-weight:750;display:grid;gap:3px;justify-items:center}.tab .ico{font-size:18px}.tab.on{background:#ff554f17;color:var(--red2)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.fieldwrap{margin:10px 0}.fieldwrap .field{width:100%}.daychips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--muted);font-size:11px}.chip.sel{border-color:var(--red);color:var(--red2);background:#ff554f12}.record{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.record:last-child{border:0}.record small{display:block;color:var(--muted);font-size:11px}.empty{padding:25px 14px;text-align:center;color:var(--muted);font-size:13px}.notice{border-radius:13px;background:#202027;padding:12px;color:var(--muted);font-size:12px}.timer{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--red);color:#190c0c;padding:10px 15px;border-radius:99px;font-weight:900;box-shadow:0 8px 30px #0008;z-index:12;white-space:nowrap}.hide{display:none!important}.modalback{position:fixed;inset:0;background:#000b;z-index:30;display:grid;align-items:end}.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 18px calc(25px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:auto}.modal h3{margin:0 0 7px}.modal p{color:var(--muted);font-size:13px}.toast{position:fixed;top:calc(15px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#24242c;border:1px solid var(--line);border-radius:99px;padding:10px 15px;font-size:12px;z-index:50;box-shadow:0 8px 30px #0008}.muted{color:var(--muted)}.red{color:var(--red2)}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.smalltxt{font-size:11px;color:var(--muted)}@media(min-width:650px){#app{padding-left:24px;padding-right:24px}.hero{padding:23px}.modal{border-radius:22px;margin:auto}}

<script>
const LEGACY_PLAN=[
 {day:'Monday',title:'Shoulders + Triceps',focus:'Delts · Triceps',icon:'◉',ex:[
  ['DB shoulder press',3,8,12,6,'kg','Press smoothly; keep ribs down.'],['DB lateral raise',3,12,20,7,'kg','Soft elbows, raise to shoulder height; no swinging.'],['DB overhead tricep extension',3,10,15,7,'kg','Both hands on one dumbbell; keep elbows pointing forward.'],['DB skull crusher',2,10,15,4.5,'kg','Lie on the floor; bend elbows and lower beside your head.'],['Bent-over DB rear delt raise',2,12,20,6,'kg','Hinge at hips and move arms out wide with light control.']]},
 {day:'Tuesday',title:'Back + Biceps',focus:'Lats · Upper back · Biceps',icon:'↗',ex:[
  ['Single-arm DB row',3,8,12,7,'kg','Brace one hand on a sturdy chair; pull elbow towards hip.'],['Bent-over DB row (both arms)',3,8,12,7,'kg','Hinge forward, flat back; pull dumbbells towards hips.'],['DB reverse fly (rear delts)',2,12,20,7,'kg','Use a controlled, light movement; avoid shrugging.'],['Standing DB curl',3,8,15,7,'kg','Elbows by sides; no body swing.'],['Seated hammer curl',2,10,15,6,'kg','Palms face each other; keep wrists neutral.']]},

 {day:'Friday',title:'Back + Biceps + Forearms',focus:'Back · Biceps · Grip',icon:'⇧',ex:[
  ['Single-arm DB row',3,8,12,7,'kg','Brace on chair; pull elbow towards hip.'],['DB reverse fly (rear delts)',2,12,20,7,'kg','Hinge forward; lift out to the sides.'],['Standing DB curl',2,8,15,7,'kg','No swinging; lower under control.'],['Reverse DB curl',2,8,12,4.5,'kg','Palms down; keep elbows close to your sides.'],['DB wrist curl',2,15,25,6,'kg','Forearm supported, palm up; move only your wrist.'],['DB reverse wrist curl',2,10,15,4.5,'kg','Forearm supported, palm down; lift the back of your hand.']]},
 {day:'Saturday',title:'Arms + Forearms',focus:'Biceps · Triceps · Grip',icon:'✚',ex:[
  ['Seated hammer curl',3,10,15,6,'kg','Palms face each other; steady reps.'],['Concentration curl',2,10,15,7,'kg','Elbow against inner thigh; curl without moving upper arm.'],['DB overhead tricep extension',2,10,15,7,'kg','Both hands on one dumbbell; controlled range.'],['Reverse DB curl',2,8,12,4.5,'kg','Palms down; do not swing.'],['Farmer hold',3,20,45,9.5,'sec','Dumbbells at sides; stand tall and grip firmly.'],['Plate pinch hold',2,15,35,2.5,'sec','Pinch plate securely between fingers and thumb.']]},
 {day:'Sunday',title:'Rest day',focus:'Recovery · Prepare for next week',icon:'☾',rest:true,ex:[]}
];
const PLAN=[
 {day:'Monday',title:'Upper A',focus:'Chest · Back · Shoulders · Arms',icon:'↗',ex:[
  ['Dumbbell floor press',3,8,15,7,'kg','Lie on the floor; lower until upper arms touch softly, then press.'],['Bent-over dumbbell row',3,8,15,7,'kg','Hinge at the hips, keep your back long, and row towards your hips.'],['Dumbbell shoulder press',2,8,15,6,'kg','Press overhead without arching your lower back.'],['Dumbbell lateral raise',2,12,20,3,'kg','Use a light pair and lift smoothly to shoulder height.'],['Dumbbell curl',2,8,15,5,'kg','Keep your elbows close to your sides; lower with control.'],['Overhead dumbbell triceps extension',2,10,15,6,'kg','Hold one dumbbell with both hands and keep your elbows comfortable.']]},
 {day:'Tuesday',title:'Lower A',focus:'Quads · Glutes · Hamstrings · Calves',icon:'⌁',ex:[
  ['Goblet squat',3,8,15,10,'kg','Hold one dumbbell at your chest; use a comfortable depth.'],['Dumbbell Romanian deadlift',3,8,15,10,'kg','Push hips back with a slight knee bend; keep weights close to your legs.'],['Dumbbell reverse lunge',2,8,12,6,'kg','Step back under control; complete reps on both sides.'],['Dumbbell glute bridge',2,10,20,8,'kg','Rest a dumbbell across your hips and pause at the top.'],['Standing dumbbell calf raise',2,12,25,6,'kg','Hold dumbbells at your sides and pause at the top.']]},
 {day:'Wednesday',title:'Recovery',focus:'Rest · Easy movement if you want it',icon:'☾',rest:true,ex:[]},
 {day:'Thursday',title:'Upper B',focus:'Chest · Back · Rear delts · Arms',icon:'↗',ex:[
  ['Dumbbell squeeze floor press',3,8,15,6,'kg','Keep the dumbbells gently pressed together as you press from the floor.'],['Dumbbell pullover',2,10,15,6,'kg','Lie on the floor; use a comfortable range and keep ribs down.'],['Bent-over dumbbell row',3,8,15,7,'kg','Brace your trunk and row both dumbbells towards your waist.'],['Bent-over rear delt raise',2,12,20,3,'kg','Use light weights and move arms out wide without shrugging.'],['Hammer curl',2,8,15,5,'kg','Keep palms facing in and wrists neutral.'],['Lying dumbbell triceps extension',2,10,15,4,'kg','Lie on the floor; bend elbows and lower beside your head.']]},
 {day:'Friday',title:'Lower B',focus:'Quads · Glutes · Hamstrings · Calves',icon:'⌁',ex:[
  ['Dumbbell split squat',3,8,12,6,'kg','Use a comfortable stance and range; complete reps on both sides.'],['Dumbbell sumo squat',3,8,15,10,'kg','Hold one dumbbell between your legs and keep knees tracking over toes.'],['Single-leg dumbbell Romanian deadlift',2,8,12,5,'kg','Use a light load, hinge slowly, and complete both sides.'],['Dumbbell glute bridge',2,10,20,8,'kg','Pause at the top without overextending your lower back.'],['Standing dumbbell calf raise',2,12,25,6,'kg','Use a full comfortable range and lower slowly.']]},
 {day:'Saturday',title:'Recovery',focus:'Rest · Gentle walk optional',icon:'☾',rest:true,ex:[]},
 {day:'Sunday',title:'Recovery',focus:'Rest · Get ready for the week',icon:'☾',rest:true,ex:[]}
];
const STORE='lift_redesign_v1';let state=load();let page='home',activeDay=0,timerEnd=0,timerInt=null;
Object.values(state.logs||{}).forEach(l=>{if(!l.splitVersion)l.splitVersion=1});
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{logs:{},cardio:[],maxDb:20,increment:0.5,rest:120,weightUnit:'kg'}}catch(e){return{logs:{},cardio:[],maxDb:20,increment:0.5,rest:120,weightUnit:'kg'}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){toast('Lift could not save. Browser storage may be full or disabled.')}}
save();
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mondayIndex(d=new Date()){return (d.getDay()+6)%7}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logFor(date=dateKey()){return state.logs[date]||(state.logs[date]={day:mondayIndex(),sets:{},splitVersion:2})}
function getSet(date,id,i,ex){let l=logFor(date);l.sets[id]??=[];l.sets[id][i]??={w:ex[4]||'',r:'',done:false};return l.sets[id][i]}
function dayForToday(){return mondayIndex()}
function lastExercise(id,before=dateKey()){let keys=Object.keys(state.logs).sort().reverse();for(let k of keys){if(k>=before)continue;let ss=state.logs[k]?.sets?.[id]||[];let done=ss.filter(x=>x.done);if(done.length)return{k,sets:done}}return null}
function fmtDate(k){return new Date(k+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function toast(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2200)}
function weekStats(){let done=0,sets=0,vol=0;let monday=new Date();monday.setHours(12,0,0,0);monday.setDate(monday.getDate()-mondayIndex(monday));for(let i=0;i<7;i++){let d=new Date(monday);d.setDate(monday.getDate()+i);let l=state.logs[dateKey(d)];if(l){let n=0;Object.values(l.sets||{}).forEach(a=>a.forEach(s=>{if(s.done){sets++;n++;vol+=(+s.w||0)*(+s.r||0)}}));if(n)done++}}return{done,sets,vol}}
function currentDay(){return PLAN[dayForToday()]}
function home(){let d=currentDay(),st=weekStats();return `<header class="top"><div class="brand"><div class="logo">L</div><div><strong>Lift</strong><div class="eyebrow">DUMBBELL TRAINING</div></div></div><button class="iconbtn" data-action="settings" aria-label="Settings">⚙</button></header><div class="eyebrow">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div><div class="page-title">Ready when you are.</div><div class="sub">Four focused sessions. Room to recover between them.</div><section class="hero"><div class="hero-top"><span class="pill"><i class="dot"></i> TODAY'S PLAN</span><span class="eyebrow">${d.rest?'RECOVERY':'DAY '+(dayForToday()+1)+' / 7'}</span></div><h2>${d.title}</h2><p>${d.rest?'Take the day off. Recovery is part of getting stronger.':d.focus+' · '+d.ex.length+' exercises'}</p><button class="btn full" data-action="${d.rest?'plan':'startToday'}">${d.rest?'VIEW WEEKLY PLAN':'START WORKOUT →'}</button></section><div class="stats"><div class="stat"><b>${st.done}<span class="muted"> / 4</span></b><span>Training days this week</span></div><div class="stat"><b>${st.sets}</b><span>Sets completed</span></div><div class="stat"><b>${Math.round(st.vol).toLocaleString('en-GB')}</b><span>Volume · kg reps</span></div></div><div class="section-head"><h3>Your week</h3><span>Mon · Tue · Thu · Fri</span></div><div class="daylist">${PLAN.map((p,i)=>`<div class="day ${i===dayForToday()?'active':''}" data-day="${i}"><div class="daymark">${p.icon}</div><div class="dayinfo"><b>${p.day} · ${p.title}</b><small>${p.rest?'Recovery day':p.ex.length+' exercises · '+p.focus}</small></div><div class="dayarrow">›</div></div>`).join('')}</div>`}
function planPage(){return `<header class="top"><div class="brand"><div class="logo">L</div><div><strong>Training plan</strong><div class="eyebrow">YOUR WEEKLY SPLIT</div></div></div></header><div class="page-title">Upper / lower</div><div class="sub">Four dumbbell sessions across Monday, Tuesday, Thursday and Friday.</div>${PLAN.map((p,i)=>`<div class="card" style="cursor:pointer" data-day="${i}"><div class="rowx" style="display:flex;align-items:center;gap:12px"><div class="daymark">${p.icon}</div><div style="flex:1"><b>${p.day} · ${p.title}</b><div class="smalltxt">${p.rest?'Recovery day':p.ex.length+' exercises · '+p.focus}</div></div><span class="muted">›</span></div>${!p.rest?`<div class="smalltxt" style="margin:12px 0 0">${p.ex.map(e=>esc(e[0])).join(' · ')}</div>`:''}</div>`).join('')}<div class="notice">Start with a load you can control through the full comfortable range. When you reach the top of the rep range on every set with good form, increase by your smallest available increment. Keep 1–3 good reps in reserve.</div>`}
function workout(dayIndex){let p=PLAN[dayIndex],date=dateKey(),l=logFor(date);l.day=dayIndex;if(p.rest)return `<header class="top"><button class="iconbtn" data-action="home">‹</button><div class="eyebrow">RECOVERY DAY</div><span></span></header><div class="page-title">Rest & recharge.</div><p class="sub">No workout scheduled today. A gentle walk is optional; let your muscles recover.</p><div class="card"><b>Recovery checklist</b><p class="smalltxt">• Get a good night's sleep<br>• Eat enough protein and overall food<br>• Drink water<br>• Don't force training through pain</p></div><button class="btn full" data-action="plan">VIEW WEEKLY PLAN</button>`;
let html=`<header class="top"><button class="iconbtn" data-action="home">‹</button><div class="eyebrow">${p.day.toUpperCase()} · WORKOUT</div><button class="iconbtn" data-action="timer">◷</button></header><div class="page-title">${p.title}</div><div class="sub">${p.focus} · Log each set as you go.</div><div class="card"><div class="rowx" style="display:flex;justify-content:space-between"><b>Workout progress</b><span class="smalltxt" id="workprogress">0 / ${p.ex.reduce((a,e)=>a+e[1],0)} sets</span></div><div class="progressbar"><i id="workbar" style="width:0%"></i></div><div class="smalltxt">Rest ${state.rest||120}s between working sets. Leave around 1–2 good reps in reserve.</div></div>`;
p.ex.forEach((e,idx)=>{let id=dayIndex+'_'+idx,prev=lastExercise(id),completed=0;let sets='';for(let i=0;i<e[1];i++){let s=getSet(date,id,i,e);if(s.done)completed++;sets+=`<div class="setrow"><span class="setnum">${i+1}</span><input class="field" type="number" min="0" step="0.5" inputmode="decimal" placeholder="${e[5]==='bodyweight'?'—':'kg'}" value="${esc(s.w)}" data-field="w" data-id="${id}" data-i="${i}" ${e[5]==='bodyweight'?'disabled':''}><input class="field" type="number" min="0" step="1" inputmode="numeric" placeholder="reps / sec" value="${esc(s.r)}" data-field="r" data-id="${id}" data-i="${i}"><input class="check" type="checkbox" data-done="1" data-id="${id}" data-i="${i}" ${s.done?'checked':''}></div>`}
let hint=prev?`Last time (${fmtDate(prev.k)}): ${prev.sets.map(s=>(s.w||'BW')+' × '+s.r).join(', ')}. Aim to add a rep while keeping form.`:`Starting guide: ${e[4]?e[4]+'kg is your recorded starting reference. Adjust if needed.':'Choose a version you can do for '+e[2]+' clean reps with 1–2 reps left.'} Target ${e[2]}–${e[3]} ${e[5]==='sec'?'seconds':'reps'} per set.`;
html+=`<div class="card"><div class="ex-top"><div class="ex-name">${esc(e[0])}</div><span class="ex-meta">${e[1]} SETS</span></div><div class="cue">${esc(e[6])}</div><div class="hint">${esc(hint)}</div><div class="sethead"><span>SET</span><span>LOAD ${e[5]==='sec'?'(kg)':'(kg)'}</span><span>${e[5]==='sec'?'SECONDS':'REPS'}</span><span>DONE</span></div>${sets}<div class="smalltxt" style="margin-top:7px">Target: ${e[2]}–${e[3]} ${e[5]==='sec'?'sec':'reps'}${completed===e[1]?' · <span class="complete">ALL SETS COMPLETE ✓</span>':''}</div></div>`});
html+=`<button class="btn full" data-action="finish">FINISH WORKOUT</button><button class="btn secondary full" data-action="plan">BACK TO PLAN</button>`;return html}
function progress(){let st=weekStats(),keys=Object.keys(state.logs).sort().reverse(),history=keys.map(k=>{let l=state.logs[k],arr=Object.values(l.sets||{}).flat().filter(s=>s.done),p=(l.splitVersion===2?PLAN:LEGACY_PLAN)[l.day??0];if(!arr.length)return'';return `<div class="record"><div><b>${fmtDate(k)}</b><small>${p?.title||'Workout'}</small></div><div style="text-align:right"><b>${arr.length} sets</b><small>${Math.round(arr.reduce((v,s)=>v+(+s.w||0)*(+s.r||0),0)).toLocaleString('en-GB')} kg reps</small></div></div>`}).filter(Boolean).slice(0,20);
let prs={};keys.forEach(k=>Object.entries(state.logs[k]?.sets||{}).forEach(([id,ss])=>ss.forEach(s=>{if(s.done&&s.w&&s.r){let ex=id.split('_'),name=PLAN[+ex[0]]?.ex[+ex[1]]?.[0]||id;if(!prs[name]||(+s.w*(+s.r))>prs[name].score)prs[name]={score:+s.w*(+s.r),w:+s.w,r:+s.r}}})));
return `<header class="top"><div class="brand"><div class="logo">L</div><div><strong>Your progress</strong><div class="eyebrow">CONSISTENCY BUILDS STRENGTH</div></div></div></header><div class="page-title">Look how far you've come.</div><div class="sub">Your training history and personal bests.</div><div class="stats" style="margin-top:18px"><div class="stat"><b>${st.done}</b><span>Days this week</span></div><div class="stat"><b>${st.sets}</b><span>Sets this week</span></div><div class="stat"><b>${Math.round(st.vol).toLocaleString('en-GB')}</b><span>Volume this week</span></div></div><div class="section-head"><h3>Personal bests</h3><span>Best logged load × reps</span></div><div class="card">${Object.keys(prs).length?Object.entries(prs).map(([n,v])=>`<div class="record"><div>${esc(n)}</div><b>${v.w}kg × ${v.r}</b></div>`).join(''):'<div class="empty">Your personal bests will appear here as you log completed sets.</div>'}</div><div class="section-head"><h3>Workout history</h3><span>Latest 20 sessions</span></div><div class="card">${history.length?history.join(''):'<div class="empty">No completed workouts yet. Your first session starts the history.</div>'}</div>`}
function settings(){return `<header class="top"><div class="brand"><div class="logo">L</div><div><strong>Settings</strong><div class="eyebrow">YOUR LIFT PROFILE</div></div></div></header><div class="page-title">Make Lift yours.</div><div class="sub">Training preferences and data management.</div><div class="card"><b>Equipment & progression</b><div class="fieldwrap"><label class="label">Maximum load per dumbbell (kg)</label><input class="field" id="maxdb" type="number" min="1" step="0.5" value="${state.maxDb||20}"></div><div class="fieldwrap"><label class="label">Smallest weight increase available (kg)</label><select class="field" id="increment">${[0.25,0.5,1,1.25,2,2.5].map(v=>`<option value="${v}" ${+(state.increment||.5)===v?'selected':''}>${v} kg</option>`).join('')}</select></div><div class="fieldwrap"><label class="label">Rest timer (seconds)</label><select class="field" id="rest">${[60,90,120,150,180].map(v=>`<option value="${v}" ${+(state.rest||120)===v?'selected':''}>${v>=60?Math.floor(v/60)+' min'+(v%60?' '+v%60+' sec':''):v+' sec'}</option>`).join('')}</select></div><button class="btn full" data-action="saveSettings">SAVE PREFERENCES</button></div><div class="card"><b>Backup your training data</b><p class="smalltxt">Your workouts are saved on this device. Export a backup regularly, especially before changing phones or clearing browser data.</p><div class="two"><button class="btn secondary" data-action="export">EXPORT BACKUP</button><button class="btn secondary" data-action="import">RESTORE BACKUP</button></div><input type="file" id="importfile" accept="application/json" class="hide"></div><div class="card"><b>About progressive overload</b><p class="smalltxt">Use the same weight until you can reach the top of the rep range on every set with clean form and 1–2 reps in reserve. Then increase by your smallest available increment and build reps again. Don't force a heavier weight just to beat last time.</p></div><div class="card"><b>Reset app data</b><p class="smalltxt">This permanently deletes workout logs stored on this device. Export a backup first if you want to keep them.</p><button class="btn ghost" data-action="reset">RESET ALL WORKOUT DATA</button></div>`}
function render(){let root=document.getElementById('app');root.innerHTML=page==='home'?home():page==='plan'?planPage():page==='workout'?workout(activeDay):page==='progress'?progress():settings();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===page));bind();if(page==='workout')updateWorkoutProgress()}
function updateWorkoutProgress(){let p=PLAN[activeDay];if(!p||p.rest)return;let l=state.logs[dateKey()],all=0,done=0;p.ex.forEach((e,i)=>{for(let j=0;j<e[1];j++){all++;if(l?.sets?.[activeDay+'_'+i]?.[j]?.done)done++}});let x=document.getElementById('workprogress'),bar=document.getElementById('workbar');if(x)x.textContent=done+' / '+all+' sets';if(bar)bar.style.width=(all?done/all*100:0)+'%'}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{page=b.dataset.tab;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{activeDay=+b.dataset.day;page='workout';render()});document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{let s=getSet(dateKey(),el.dataset.id,+el.dataset.i,PLAN[activeDay].ex[+el.dataset.id.split('_')[1]]);s[el.dataset.field]=el.value;save()});document.querySelectorAll('[data-done]').forEach(el=>el.onchange=()=>{let idx=+el.dataset.id.split('_')[1],s=getSet(dateKey(),el.dataset.id,+el.dataset.i,PLAN[activeDay].ex[idx]);if(el.checked){let card=el.closest('.card');let w=card.querySelector(`[data-field="w"][data-i="${el.dataset.i}"]`),r=card.querySelector(`[data-field="r"][data-i="${el.dataset.i}"]`);if(!r.value){el.checked=false;toast('Enter your reps or seconds first.');return}if(w&&!w.disabled&&!w.value){el.checked=false;toast('Enter the weight you used first.');return}}s.done=el.checked;save();updateWorkoutProgress();if(el.checked)startTimer(state.rest||120)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));let mx=document.getElementById('maxdb');if(mx)mx.onchange=()=>{state.maxDb=+mx.value||20;save()};let inc=document.getElementById('increment');if(inc)inc.onchange=()=>{state.increment=+inc.value;save()};let rest=document.getElementById('rest');if(rest)rest.onchange=()=>{state.rest=+rest.value;save()};let file=document.getElementById('importfile');if(file)file.onchange=importFile}
function action(a){if(a==='settings'){page='settings';render()}if(a==='home'){page='home';render()}if(a==='plan'){page='plan';render()}if(a==='startToday'){activeDay=dayForToday();page='workout';render()}if(a==='finish'){toast('Workout saved to your history.');page='progress';render()}if(a==='timer')startTimer(state.rest||120);if(a==='saveSettings'){save();toast('Preferences saved.')}if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lift-backup-'+dateKey()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup exported.')}if(a==='import')document.getElementById('importfile').click();if(a==='reset'){if(confirm('Delete all workout history and settings on this device? Export a backup first if needed.')){state={logs:{},cardio:[],maxDb:20,increment:.5,rest:120};save();page='home';render();toast('Workout data reset.')}}}
function importFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.logs)throw Error();state={...state,...x};save();render();toast('Backup restored.')}catch(err){alert('That file is not a valid Lift backup.')}};r.readAsText(f)}
function startTimer(sec){timerEnd=Date.now()+sec*1000;let el=document.getElementById('timer');el.classList.remove('hide');clearInterval(timerInt);function tick(){let left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));el.textContent=left?`REST  ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}  · TAP TO DISMISS`:'REST COMPLETE  ✓  · DISMISS';if(!left){try{navigator.vibrate?.([250,100,250])}catch(e){}clearInterval(timerInt)}}el.onclick=()=>{clearInterval(timerInt);el.classList.add('hide')};tick();timerInt=setInterval(tick,500)}
render();
</script></body></html>
