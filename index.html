<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1917">
<meta name="description" content="RoutineHub brings your daily routines, meals and dumbbell training together.">
<title>RoutineHub</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="routine.css">
</head>
<body>
<header class="site-header">
  <a class="site-brand" href="./index.html" aria-label="RoutineHub home"><span class="brand-mark">R</span><span>RoutineHub</span></a>
  <span class="site-tagline">A little better, every day.</span>
</header>
<div id="routine-view">
  <nav class="section-tabs" aria-label="Routine views">
    <button id="t1" class="on" type="button">Today</button>
    <button id="t2" type="button">Week</button>
    <button id="t3" type="button">Edit</button>
  </nav>
  <main id="app"></main>
</div>
<section id="embedded-meals" class="embedded-view" aria-label="Meals"><iframe id="mealsFrame" title="Meals" src="meals.html"></iframe></section>
<section id="embedded-lift" class="embedded-view" aria-label="Lift"><iframe id="liftFrame" title="Lift" src="lift.html"></iframe></section>
<nav class="global-nav" aria-label="Main navigation">
  <button type="button" data-hub="routine" class="active"><span aria-hidden="true">◷</span>RoutineHub</button>
  <button type="button" data-hub="meals"><span aria-hidden="true">◉</span>Meals</button>
  <button type="button" data-hub="lift"><span aria-hidden="true">↗</span>Lift</button>
</nav>
<script src="routine.js"></script>
</body>
</html>
