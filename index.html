<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoutineHub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07191c">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#07191c;--panel:#10272a;--panel2:#143236;--text:#e8f4ef;--mute:#91aaa3;--acc:#42e6a4;--cyan:#55d9d0;--amber:#ffbd69;--line:#28504d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
html,body{margin:0;background:radial-gradient(ellipse at 50% -15%,#174344 0%,var(--bg) 52%);color:var(--text);font-size:16px;-webkit-text-size-adjust:100%;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{padding:20px 16px calc(82px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto}
h1{font-size:22px;color:var(--text);letter-spacing:-.5px;margin:8px 0 14px;font-weight:800}
.art{color:var(--acc);font-size:13px;line-height:1.1;margin:4px 0 12px}
.card{background:linear-gradient(145deg,rgba(20,50,54,.96),rgba(12,34,37,.96));border:1px solid var(--line);border-radius:18px!important;padding:14px;margin-bottom:11px;box-shadow:0 8px 22px #0002}
.next{border:1px solid var(--acc);box-shadow:0 0 0 1px #42e6a422,0 8px 24px #0003}.done{opacity:.58}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px}
.tip{font-size:13px;color:var(--mute)}.rd{color:var(--acc)}
button{background:#143b3a;border:1px solid #32665e;border-radius:12px!important;color:var(--acc);font-size:14px;font-weight:650;padding:9px 11px;text-decoration:none}
input[type=checkbox]{appearance:none;width:23px;height:23px;margin:0;background:#0a2022;border:1px solid #5d8178;border-radius:7px!important;vertical-align:middle;flex:none;position:relative}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}input[type=checkbox]:checked:after{content:"✓";position:absolute;inset:-1px 0 0;text-align:center;color:#06231c;font-weight:900;font-size:16px}
select,input[type=text],input[type=time],input[type=number]{background:#0a2022;color:var(--text);border:1px solid #32605a;border-radius:11px!important;font-size:16px;padding:10px;width:100%}
.t{color:var(--cyan);font-weight:750;flex:none;width:6ch}.w{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(5,22,24,.96);backdrop-filter:blur(18px);border-top:1px solid #28504d;padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;height:48px;text-decoration:none;color:var(--mute);background:transparent;border:0;border-radius:12px!important;padding:0;font-size:12px;letter-spacing:.2px}nav button.on{color:#06251e;background:var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<nav><button id="t1">[TODAY]</button><button id="t2">[WEEK]</button><button id="t3">[EDIT]</button></nav>
<script>
var IC={sleep:"☾",water:"滴",study:"▤",social:"♡",eat:"✦",free:"•",move:"↗",clean:"⌂"};
var DEF=[
 {id:201,t:"08:00",n:"Wake up. Open curtains, get daylight and drink 250ml water",c:"sleep",ml:250},
 {id:202,t:"08:05",n:"Use the toilet, wash hands and start the day",c:"free"},
 {id:203,t:"08:10",n:"Make your bed and open the window briefly to freshen the room",c:"clean"},
 {id:204,t:"08:15",n:"Morning face care: gently cleanse, pat dry and moisturise; apply SPF 30–50 if going outdoors",c:"free"},
 {id:205,t:"08:20",n:"Brush teeth for 2 minutes with fluoride toothpaste. Spit, don't rinse",c:"free"},
 {id:206,t:"08:25",n:"Shower day: wash armpits, groin, bum, feet and skin folds with body wash; rinse well",c:"free",d:"days:1,3,5,0"},
 {id:242,t:"08:25",n:"Non-shower day: wash face, armpits, groin and feet; use a clean flannel and freshen up",c:"free",d:"days:2,4,6"},
 {id:243,t:"08:32",n:"Hair wash: shampoo your scalp gently, rinse well, then condition the mid-lengths and ends; rinse as directed",c:"free",d:"days:0,3"},
 {id:207,t:"08:40",n:"Dry thoroughly after showering or washing, especially between toes and skin folds; use a clean towel",c:"free"},
 {id:208,t:"08:40",n:"Apply deodorant to dry underarms; put on fresh underwear, socks and clothes",c:"free"},
 {id:209,t:"08:45",n:"Comb/style hair and check nails, beard and general grooming",c:"free"},
 {id:210,t:"08:50",n:"Apply fragrance: start with 1–2 sprays on clean, dry skin",c:"free"},
 {id:211,t:"09:00",n:"Breakfast and any planned supplements (e.g. creatine if using)",c:"eat"},
 {id:212,t:"10:30",n:"Drink 250ml water and take a short movement break",c:"water",ml:250},
 {id:213,t:"12:30",n:"Lunch and a glass of water",c:"eat","ml":250},
 {id:214,t:"13:00",n:"Use mouthwash at a separate time from brushing; follow the bottle directions",c:"free"},
 {id:215,t:"15:30",n:"Drink 250ml water; take a short walk or stretch break",c:"water",ml:250},
 {id:216,t:"18:00",n:"Workout or planned activity; take water and follow your training plan",c:"move"},
 {id:217,t:"19:00",n:"Dinner and a glass of water",c:"eat","ml":250},
 {id:218,t:"20:00",n:"10-minute room reset: put clothes in laundry, clear surfaces and put items away",c:"clean"},
 {id:219,t:"20:10",n:"Wash dishes, wipe kitchen worktops and sink after eating",c:"clean"},
 {id:220,t:"20:20",n:"Check bins and recycling; empty if full and replace the liner",c:"clean"},
 {id:221,t:"21:30",n:"Evening face care: cleanse gently and apply moisturiser",c:"free"},
 {id:222,t:"21:40",n:"Floss carefully between every tooth; be gentle around the gumline",c:"free"},
 {id:223,t:"21:45",n:"Gently clean your tongue with the scraper; don't press hard",c:"free"},
 {id:224,t:"21:50",n:"Brush teeth for 2 minutes with fluoride toothpaste. Spit, don't rinse",c:"free"},
 {id:225,t:"22:10",n:"Prepare tomorrow: choose clothes, check plans and get anything ready",c:"free"},
 {id:226,t:"22:20",n:"Final home check: cups away, floor clear, doors/windows secure",c:"clean"},
 {id:227,t:"23:00",n:"Start wind-down: dim lights, lower stimulation and stop busy tasks",c:"sleep"},
 {id:228,t:"23:15",n:"Put phone away or use a calm activity; keep bedroom cool, dark and quiet",c:"sleep"},
 {id:229,t:"00:00",n:"Lights out. Sleep target: midnight to 8:00am (8 hours)",c:"sleep"},
 {id:230,t:"17:30",n:"Laundry day: wash clothes, dry them fully and put them away",c:"clean",d:"d1"},
 {id:231,t:"17:30",n:"Bathroom clean: sink, taps, toilet, shower/bath and floor",c:"clean",d:"d2"},
 {id:232,t:"17:30",n:"Dust bedroom and living areas: desk, shelves, skirting and reachable surfaces",c:"clean",d:"d3"},
 {id:233,t:"17:30",n:"Vacuum bedroom and main floors; mop hard floors if needed",c:"clean",d:"d4"},
 {id:234,t:"17:30",n:"Wash towels and bath mat; hang them fully open to dry",c:"clean",d:"d5"},
 {id:235,t:"11:00",n:"Change bedsheets and pillowcases; put used bedding in the wash",c:"clean",d:"d6"},
 {id:236,t:"11:30",n:"Weekly kitchen reset: clean hob, microwave exterior, fridge handles and bin area",c:"clean",d:"d0"},
 {id:237,t:"12:00",n:"Personal upkeep: trim/file nails, clean trimmer heads and wipe grooming tools",c:"free",d:"d0"},
 {id:238,t:"12:15",n:"Check toiletries and laundry supplies; add anything running low to your shopping list",c:"free",d:"d0"},
 {id:239,t:"17:00",n:"Monthly deep clean: bathroom tiles, grout, shower screen and hard-to-reach areas",c:"clean",d:"m1"},
 {id:240,t:"17:20",n:"Clean windows, mirrors and inside appliances (microwave/fridge shelves)",c:"clean",d:"m1"},
 {id:241,t:"17:40",n:"Declutter one drawer, shelf or storage area; put unwanted items aside",c:"clean",d:"m1"}
];
var S,tab=1;
try{S=JSON.parse(localStorage.getItem("rt1"))}catch(e){}
if(!S||!S.r||!S.days)S={r:JSON.parse(JSON.stringify(DEF)),days:{},wt:2000,v:4};
if(S.v!==8){S.r=JSON.parse(JSON.stringify(DEF));S.v=8}
function save(){try{localStorage.setItem("rt1",JSON.stringify(S))}catch(e){}}
function key(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function day(k){return S.days[k]||(S.days[k]={d:{},w:0})}
function mins(t){var a=(t||"0:0").split(":");return+a[0]*60+ +a[1]}
function ord(t){var m=mins(t);return m<360?m+1440:m}
function list(){return S.r.slice().sort(function(a,b){return ord(a.t)-ord(b.t)})}
function app(b,k){var dt=new Date(k+"T00:00:00"),g=dt.getDay();return!b.d||(b.d==="wk"?g>0&&g<6:b.d==="we"?g===0||g===6:b.d==="m1"?dt.getDate()===1:b.d.indexOf("days:")===0?b.d.slice(5).split(",").map(Number).indexOf(g)!==-1:/^d\d$/.test(b.d)?g===+b.d.charAt(1):true)}
function slp(){var a=S.r.filter(function(b){return b.id===1})[0],z=S.r.filter(function(b){return b.id===100})[0];if(!a||!z)return null;return{wake:a.t,bed:z.t,h:((mins(a.t)-mins(z.t)+1440)%1440)/60}}
function pct(k){var dd=S.days[k]||{d:{}},en=S.r.filter(function(b){return b.on!==false&&app(b,k)}),n=en.filter(function(b){return dd.d[b.id]}).length;return en.length?Math.round(100*n/en.length):0}
function bar(p,w){var n=Math.max(0,Math.min(w,Math.round(p/100*w)));return"["+"#".repeat(n)+"-".repeat(w-n)+"]"}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function today(){
 var k=key(),dd=day(k),nw=new Date(),nm=nw.getHours()*60+nw.getMinutes();nm=nm<360?nm+1440:nm;
 var L=list().filter(function(b){return b.on!==false&&app(b,k)}),nx=-1;
 for(var i=0;i<L.length;i++)if(!dd.d[L[i].id]&&ord(L[i].t)>=nm-30){nx=i;break}
 if(nx<0)for(i=0;i<L.length;i++)if(!dd.d[L[i].id]){nx=i;break}
 var p=pct(k),wp=Math.round(100*dd.w/S.wt);
 var h='<pre class="art">'+[" .-----------.","|   12:00    |","|  [x] [ ]   |"," '-----------'"," zz  ~  >  ## "].join("\n")+'</pre><h1>TODAY</h1>';
 h+='<div class="card"><b>> PROGRESS</b><div class="tip" style="margin-top:6px">'+bar(p,20)+' '+p+'%</div></div>';
 var sp=slp();if(sp)h+='<div class="card"><b>> SLEEP</b><div class="tip" style="margin-top:6px">Lights out '+sp.bed+', wake '+sp.wake+', plan '+sp.h.toFixed(1)+' hours</div><div class="row" style="margin-top:6px"><span class="tip">Last night (hours)</span><input type="number" step="0.5" id="sl" value="'+(dd.sl||"")+'" inputmode="decimal" style="width:90px"></div></div>';
 h+='<div class="card"><b>> WATER</b><div class="tip" style="margin-top:6px">'+bar(wp,20)+' '+dd.w+' / '+S.wt+'ml</div><div class="w"><button data-w="250">[+250ml]</button><button data-w="100">[+100ml]</button><button data-w="-250">[-250ml]</button></div></div>';
 L.forEach(function(b,i){h+='<div class="card'+(dd.d[b.id]?' done':'')+(i===nx?' next':'')+'"><div class="row"><input type="checkbox" data-b="'+b.id+'"'+(dd.d[b.id]?' checked':'')+'><span class="t">'+esc(b.t)+'</span><span style="flex:1">'+esc(b.n)+'</span><span class="tip">'+(b.ml?"+"+b.ml+"ml ":"")+(IC[b.c]||"")+'</span></div>'+(i===nx?'<div class="tip rd" style="margin-top:4px">&gt; next up</div>':'')+'</div>'});
 return h}
function week(){
 var h='<h1>THIS WEEK</h1>',tot=0,st=0,run=0,nm=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=key(d),p=pct(k),w=(S.days[k]||{w:0}).w;tot+=p;
  h+='<div class="card"><div class="row"><b>'+nm[d.getDay()]+' '+k.slice(5)+'</b><span class="tip">'+p+'%</span></div><div class="tip" style="margin-top:6px">'+bar(p,20)+'</div><div class="tip">water '+bar(Math.round(100*w/S.wt),10)+' '+w+'ml</div></div>'}
 for(i=0;i<60;i++){var d2=new Date();d2.setDate(d2.getDate()-i);if(pct(key(d2))>=70)run++;else if(i>0)break;else if(i===0)continue}
 return h+'<div class="card"><b>> SUMMARY</b><div class="tip" style="margin-top:6px">7-day average: '+Math.round(tot/7)+'%'+(function(){var t=0,n=0;for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var v=(S.days[key(d)]||{}).sl;if(v>0){t+=v;n++}}return n?'<br>Average sleep: '+(t/n).toFixed(1)+'h ('+n+' nights logged)':''})()+'<br>Streak of days at 70% or more: '+run+'</div></div>'}
function edit(){
 var h='<h1>EDIT ROUTINE</h1><p class="tip">Change times, names or switch blocks off. Times before 06:00 count as after midnight.</p><div class="card"><span class="tip">Water target (ml)</span><input type="number" id="wt" value="'+S.wt+'" inputmode="numeric"></div><div class="card"><b>> SHIFT THE WHOLE DAY</b><div class="tip">Moves every time earlier or later. Use it to move your sleep 15 minutes at a time.</div><button data-sh="-15">[15 min earlier]</button><button data-sh="15">[15 min later]</button></div>';
 list().forEach(function(b){h+='<div class="card"><div class="row"><input type="checkbox" data-on="'+b.id+'"'+(b.on!==false?' checked':'')+'><input type="time" data-t="'+b.id+'" value="'+esc(b.t)+'" style="width:120px"><select data-d="'+b.id+'" style="width:110px"><option value="all"'+(!b.d?" selected":"")+'>Every day</option><option value="wk"'+(b.d==="wk"?" selected":"")+'>Mon-Fri</option><option value="we"'+(b.d==="we"?" selected":"")+'>Sat-Sun</option><option value="d0"'+(b.d==="d0"?" selected":"")+'>Sun only</option><option value="d1"'+(b.d==="d1"?" selected":"")+'>Mon only</option><option value="d2"'+(b.d==="d2"?" selected":"")+'>Tue only</option><option value="d3"'+(b.d==="d3"?" selected":"")+'>Wed only</option><option value="d4"'+(b.d==="d4"?" selected":"")+'>Thu only</option><option value="d5"'+(b.d==="d5"?" selected":"")+'>Fri only</option><option value="d6"'+(b.d==="d6"?" selected":"")+'>Sat only</option><option value="days:1,3,5,0"'+(b.d==="days:1,3,5,0"?" selected":"")+'>Mon/Wed/Fri/Sun</option><option value="days:0,3"'+(b.d==="days:0,3"?" selected":"")+'>Wed/Sun</option><option value="days:2,4,6"'+(b.d==="days:2,4,6"?" selected":"")+'>Tue/Thu/Sat</option><option value="m1"'+(b.d==="m1"?" selected":"")+'>Monthly (1st)</option></select><button data-x="'+b.id+'">[delete]</button></div><input type="text" data-n="'+b.id+'" value="'+esc(b.n)+'" style="margin-top:6px"></div>'});
 return h+'<button id="add">[+ add block]</button><br><button id="rs" class="tip">[reset routine]</button>'}
function render(){var y=window.scrollY;document.getElementById("app").innerHTML=tab===1?today():tab===2?week():edit();
 for(var i=1;i<4;i++)document.getElementById("t"+i).className=tab===i?"on":"";window.scrollTo(0,y);bind()}
function bind(){var q=function(s){return document.querySelectorAll(s)};
 q("[data-b]").forEach(function(e){e.onchange=function(){var d=day(key()),b=S.r.filter(function(x){return x.id==e.dataset.b})[0];d.d[e.dataset.b]=e.checked?1:0;if(b&&b.ml)d.w=Math.max(0,d.w+(e.checked?1:-1)*b.ml);save();render()}});
 q("[data-w]").forEach(function(e){e.onclick=function(){var d=day(key());d.w=Math.max(0,d.w+(+e.dataset.w));save();render()}});
 q("[data-on]").forEach(function(e){e.onchange=function(){S.r.forEach(function(b){if(b.id==e.dataset.on)b.on=e.checked});save()}});
 q("[data-t]").forEach(function(e){e.onchange=function(){S.r.forEach(function(b){if(b.id==e.dataset.t&&e.value)b.t=e.value});save();render()}});
 q("[data-d]").forEach(function(e){e.onchange=function(){S.r.forEach(function(b){if(b.id==e.dataset.d){if(e.value==="all")delete b.d;else b.d=e.value}});save()}});
 q("[data-n]").forEach(function(e){e.onchange=function(){S.r.forEach(function(b){if(b.id==e.dataset.n)b.n=e.value});save()}});
 q("[data-sh]").forEach(function(e){e.onclick=function(){S.r.forEach(function(b){var m=(mins(b.t)+(+e.dataset.sh)+1440)%1440;b.t=("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)});save();render()}});
 var sl=document.getElementById("sl");if(sl)sl.onchange=function(){day(key()).sl=+sl.value||0;save()};
 q("[data-x]").forEach(function(e){e.onclick=function(){if(confirm("Delete this block?")){S.r=S.r.filter(function(b){return b.id!=e.dataset.x});save();render()}}});
 var a=document.getElementById("add");if(a)a.onclick=function(){var m=0;S.r.forEach(function(b){m=Math.max(m,b.id)});S.r.push({id:m+1,t:"12:00",n:"New block",c:"free"});save();render()};
 var r=document.getElementById("rs");if(r)r.onclick=function(){if(confirm("Reset the routine to the suggested one?")){S.r=JSON.parse(JSON.stringify(DEF));save();render()}};
 var w=document.getElementById("wt");if(w)w.onchange=function(){S.wt=Math.max(250,+w.value||2000);save()}}
[1,2,3].forEach(function(k){document.getElementById("t"+k).onclick=function(){tab=k;window.scrollTo(0,0);render()}});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
